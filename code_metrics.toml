# Code-metrics gate configuration for `mudu_metrics`.
#
# The gate walks `crates/**/*.rs` and enforces two kinds of limits:
#   * a maximum number of physical lines per source file, and
#   * a maximum number of physical lines per item (class / struct / function).
#
# Files whose header carries the canonical "Generated by ... Do not edit
# manually." marker are treated as generated and are skipped automatically.
# `exclude` lists additional files or glob patterns to skip (relative to the
# scanned root).

# Maximum physical lines in a single source file.
max_file_lines = 1000

# Maximum physical lines in a single struct / enum / union.
max_struct_lines = 500

# Maximum physical lines in a single function or method.
max_function_lines = 100

# Maximum physical lines in a single class (impl block / trait definition).
max_class_lines = 500

# Files or glob patterns exempt from every check above, relative to the
# scanned root. The SpacetimeDB client bindings are emitted by the external
# `spacetime` CLI (their header is not the canonical generated marker), so
# exclude the tree; it is matched by the `--root example` invocation.
exclude = ["mpk/tpcc/spacetimedb"]
