[env]

PACKAGE_NAME = "tpcc"
WASM_ARTIFACT_NAME = "tpcc"
PROFILE = "release"
TARGET = "wasm32-wasip2"
WASM_FILE = "${CARGO_MAKE_WORKING_DIRECTORY}/../../target/${TARGET}/${PROFILE}/${WASM_ARTIFACT_NAME}.wasm"
PACKAGE_TARGET = "${CARGO_MAKE_WORKING_DIRECTORY}/../../target/${TARGET}/${PROFILE}/${PACKAGE_NAME}.mpk"

[tasks.generate]
command = "mgen"
args = [
    "entity",
    "--input-source-files",
    "${CARGO_MAKE_WORKING_DIRECTORY}/sql/ddl.sql",
    "--output-source-folder",
    "${CARGO_MAKE_WORKING_DIRECTORY}/src/rust",
    "--type-desc",
    "${CARGO_MAKE_WORKING_DIRECTORY}/package/type.desc.json",
    "--lang",
    "rust"
]

[tasks.transpile]
command = "python3"
args = [
    "../../script/build/transpiler.py",
    "--config",
        "${CARGO_MAKE_WORKING_DIRECTORY}/build-cfg/transpiler-cfg.toml",
    "--source",
        "${CARGO_MAKE_WORKING_DIRECTORY}/src/rust",
    "--target",
        "${CARGO_MAKE_WORKING_DIRECTORY}/src/generated",
    "--artifact",
        "${CARGO_MAKE_WORKING_DIRECTORY}/src/artifact",
    "--wasm-file",
        "${WASM_FILE}",
    "--package-desc",
        "${CARGO_MAKE_WORKING_DIRECTORY}/package/package.desc.json",
    "--type-desc",
        "${CARGO_MAKE_WORKING_DIRECTORY}/package/type.desc.json",
]

# mgen and the transpiler do not emit rustfmt-clean code; format the crate so
# regeneration never breaks the CI `cargo fmt -- --check` gate.
[tasks.format]
dependencies = ["generate", "transpile"]
command = "cargo"
args = ["fmt", "--manifest-path", "${CARGO_MAKE_WORKING_DIRECTORY}/Cargo.toml"]

[tasks.cargo-build]
dependencies = ["format"]
command = "cargo"
args = ["build", "--target", "${TARGET}", "--${PROFILE}", "--lib"]

[tasks.package]
dependencies = ["generate", "transpile", "cargo-build"]
command = "mpm-build"
args = [
    "create",
    "--package-cfg", "${CARGO_MAKE_WORKING_DIRECTORY}/package/package.cfg.json",
    "--package-desc", "${CARGO_MAKE_WORKING_DIRECTORY}/package/package.desc.json",
    "--ddl-sql", "${CARGO_MAKE_WORKING_DIRECTORY}/sql/ddl.sql",
    "--initdb-sql", "${CARGO_MAKE_WORKING_DIRECTORY}/sql/init.sql",
    "--wasm-files", "${WASM_FILE}",
    "--output", "${PACKAGE_TARGET}"
]

# Warehouse-partitioned variant of the tpcc package: same procedures, but the
# packaged DDL creates the partition rule and partitioned tables so procedure
# mode can scale across workers.
[tasks.package-partitioned]
dependencies = ["package"]
command = "mpm-build"
args = [
    "create",
    "--package-cfg", "${CARGO_MAKE_WORKING_DIRECTORY}/package/package.cfg.json",
    "--package-desc", "${CARGO_MAKE_WORKING_DIRECTORY}/package/package.desc.json",
    "--ddl-sql", "${CARGO_MAKE_WORKING_DIRECTORY}/sql/ddl_partitioned_packaged.sql",
    "--initdb-sql", "${CARGO_MAKE_WORKING_DIRECTORY}/sql/init.sql",
    "--wasm-files", "${WASM_FILE}",
    "--output", "${CARGO_MAKE_WORKING_DIRECTORY}/../../target/${TARGET}/${PROFILE}/tpcc_partitioned.mpk"
]


[tasks.default]
alias = "package"
