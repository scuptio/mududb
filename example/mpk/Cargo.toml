[workspace]
resolver = "2"

members = [
    "app1",
    "wallet",
    "vote",
    "key-value",
    "ycsb",
    "tpcc",
]

[workspace.package]
rust-version = "1.96"

[workspace.lints.rust]
future_incompatible = { level = "allow", priority = -1 }
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }

[workspace.lints.clippy]
disallowed_types = "deny"

[profile.release]
panic = "abort"

# Line-tables-only debug info: keeps backtrace line numbers while cutting
# link-time memory and target-dir size (shared with the group workspaces).
[profile.dev]
debug = 1

[workspace.dependencies]
# Crates from the sdk group workspace.
mududb = { path = "../../crates/sdk/mududb" }

# Crates from the common group workspace.
mudu_client = { path = "../../crates/common/mudu_client" }
mudu_sys = { path = "../../crates/common/mudu_sys" }
mudu_utils = { path = "../../crates/common/mudu_utils" }

# Crates from the db-kernel group workspace.
mudu_adapter = { path = "../../crates/db-kernel/mudu_adapter" }
mudu_runtime = { path = "../../crates/db-kernel/mudu_runtime" }

# External dependencies (kept in sync with versions.toml where shared).
async-backtrace = { version = "0.2.7" }
bigdecimal = { version = "0.4.10" }
chrono = { version = "0.4.42" }
clap = { version = "4.5.50" }
fallible-iterator = { version = "0.3.0" }
lazy_static = { version = "1.5.0" }
serde_json = { version = "1.0.145", features = ["preserve_order"] }
tokio = { version = "1.47.1", features = ["full"] }
tracing-subscriber = { version = "0.3.20" }
uuid = { version = "1.18.1", features = ["v4", "js"] }
wit-bindgen = { version = "0.58.0" }
