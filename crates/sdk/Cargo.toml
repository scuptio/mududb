[workspace]
resolver = "2"

members = [
    "mududb",
    "mudu_api_sync",
]

[workspace.package]
rust-version = "1.96"

[workspace.lints.rust]
future_incompatible = { level = "allow", priority = -1 }
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }

[workspace.lints.clippy]
disallowed_types = "deny"

[profile.release]
panic = "abort"

# Line-tables-only debug info: keeps backtrace line numbers while cutting
# link-time memory and target-dir size several-fold (full `debug = 2` is the
# main driver of linker OOM kills when building this workspace's test
# binaries in memory-constrained environments).
[profile.dev]
debug = 1

[workspace.dependencies]
# Crates in this workspace.
mududb = { path = "mududb" }
mudu_api_sync = { path = "mudu_api_sync" }

# Crates from the sibling common workspace.
mudu = { path = "../common/mudu" }
mudu_binding = { path = "../common/mudu_binding" }
mudu_build_common = { path = "../common/mudu_build_common" }
mudu_contract = { path = "../common/mudu_contract" }
mudu_sys = { path = "../common/mudu_sys" }
mudu_sys_impl = { path = "../common/mudu_sys_impl" }
mudu_type = { path = "../common/mudu_type" }

# External dependencies.
toml = { version = "1.1.0", features = ["preserve_order"] }

# Versions read by the mudu_api_sync build script (via
# `mudu_build_common::read_workspace_versions`) when generating the
# standalone `mudu_api/rust` SDK manifests. Keep this list in sync with the
# `keys` array in crates/sdk/mudu_api_sync/build.rs.
rmp = { version = "0.8.15" }
rmp-serde = { version = "1.3.0" }
rusqlite = { version = "0.40.1" }
serde = { version = "1.0.228", features = ["default", "derive", "serde_derive"] }
serde_repr = { version = "0.1.20" }
tokio = { version = "1.47.1", features = ["full"] }
wit-bindgen = { version = "0.58.0" }
