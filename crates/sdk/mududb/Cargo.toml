[package]
name = "mududb"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license = "Apache-2.0"
description = "App-facing facade crate for MuduDB: aggregates the public interfaces (types, contract, binding, sys) behind feature flags"
repository = "https://github.com/ybbh/mududb_p"

[lints]
workspace = true

[[test]]
name = "facade_scenario"
path = "tests/facade_scenario.rs"
required-features = ["standalone-adapter"]

[dependencies]
mudu = { workspace = true, optional = true }
mudu_type = { workspace = true, optional = true }
mudu_contract = { workspace = true, optional = true }
mudu_binding = { workspace = true, optional = true }
mudu_sys = { workspace = true, optional = true }
sys_interface = { path = "../../common/sys_interface", optional = true, default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
sys_interface_standalone = { path = "../../db-kernel/sys_interface_standalone", optional = true }

[features]
default = ["app"]
app = [
    "dep:mudu",
    "dep:mudu_type",
    "dep:mudu_contract",
    "dep:mudu_binding",
    "dep:mudu_sys",
    "mudu_sys/native",
    "component-model",
]

interface = ["dep:sys_interface"]
component-model = ["interface", "sys_interface/component-model"]
wasip2 = ["interface", "sys_interface/wasip2"]
async = ["interface", "sys_interface/async", "sys_interface_standalone?/async"]
# Enables local standalone syscall execution via the in-process adapter.
# Use this for local tests/debug runs without an external host/runtime.
standalone-adapter = ["interface", "dep:sys_interface_standalone"]
uniffi-bindings = ["standalone-adapter", "sys_interface_standalone/uniffi-bindings"]
