[env]

PACKAGE_NAME = "mod_0"
PROFILE = "release"
TARGET = "wasm32-wasip2"
WASM_FILE = "${CARGO_MAKE_WORKING_DIRECTORY}/../../../../target/${TARGET}/${PROFILE}/${PACKAGE_NAME}.wasm"
PACKAGE_TARGET = "${CARGO_MAKE_WORKING_DIRECTORY}/../../../../target/${TARGET}/${PROFILE}/${PACKAGE_NAME}.mpk"
WORKSPACE_ROOT = "${CARGO_MAKE_WORKING_DIRECTORY}/../../../.."

# Regenerate the wallet entity's type descriptor used by the transpiler.
[tasks.generate]
command = "mgen"
args = [
    "entity",
    "--input-source-files",
    "${CARGO_MAKE_WORKING_DIRECTORY}/sql/ddl.sql",
    "--output-source-folder",
    "${CARGO_MAKE_WORKING_DIRECTORY}/src/entity_scratch",
    "--type-desc",
    "${CARGO_MAKE_WORKING_DIRECTORY}/package/type.desc.json",
    "--lang",
    "rust"
]

[tasks.transpile]
dependencies = ["generate", "check-sql"]
command = "python3"
args = [
    "${WORKSPACE_ROOT}/script/build/transpiler.py",
    "--config",
    "${CARGO_MAKE_WORKING_DIRECTORY}/build-cfg/transpiler-cfg.toml",
    "--source",
    "${CARGO_MAKE_WORKING_DIRECTORY}/src/rust",
    "--target",
    "${CARGO_MAKE_WORKING_DIRECTORY}/src/generated",
    "--artifact",
    "${CARGO_MAKE_WORKING_DIRECTORY}/src/artifact",
    "--wasm-file",
    "${WASM_FILE}",
    "--package-desc",
    "${CARGO_MAKE_WORKING_DIRECTORY}/package/package.desc.json",
    "--type-desc",
    "${CARGO_MAKE_WORKING_DIRECTORY}/package/type.desc.json"
]

[tasks.cargo-build]
dependencies = ["transpile"]
command = "cargo"
args = ["build", "--target", "${TARGET}", "--${PROFILE}"]

# Statically check every SQL string literal in src/rust against the DDL
# schema (see doc/dev/sql_subset.md). ddl_dynamic.sql describes the
# wallets table the procedure itself creates at runtime.
[tasks.check-sql]
dependencies = ["generate"]
command = "cargo"
args = [
    "run", "--quiet",
    "--manifest-path", "${WORKSPACE_ROOT}/crates/tools/mudu_gen/Cargo.toml",
    "--bin", "mgen",
    "--",
    "check-sql",
    "--lang", "rust",
    "--ddl",
    "${CARGO_MAKE_WORKING_DIRECTORY}/sql/ddl.sql",
    "${CARGO_MAKE_WORKING_DIRECTORY}/sql/ddl_dynamic.sql",
    "--input", "${CARGO_MAKE_WORKING_DIRECTORY}/src/rust"
]

[tasks.package]
dependencies = ["generate", "transpile", "cargo-build"]
command = "mpm-build"
args = [
    "create",
    "--package-cfg", "${CARGO_MAKE_WORKING_DIRECTORY}/package/package.cfg.json",
    "--package-desc", "${CARGO_MAKE_WORKING_DIRECTORY}/package/package.desc.json",
    "--ddl-sql", "${CARGO_MAKE_WORKING_DIRECTORY}/sql/ddl.sql",
    "--initdb-sql", "${CARGO_MAKE_WORKING_DIRECTORY}/sql/init.sql",
    "--wasm-files", "${WASM_FILE}",
    "--output", "${PACKAGE_TARGET}"
]

[tasks.default]
alias = "package"
