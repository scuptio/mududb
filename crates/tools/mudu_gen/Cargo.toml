[package]
name = "mudu_gen"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license = "Apache-2.0"


build = "build.rs"

[lints]
workspace = true

[dependencies]
mudu = { workspace = true }
mudu_sys = { workspace = true }
mudu_utils = { workspace = true }
sql_parser = { workspace = true }
tree-sitter = { workspace = true }
tree-sitter-c-sharp = { workspace = true }
tree-sitter-typescript = { workspace = true }
tree-sitter-wit = { workspace = true }
# Crate-local on purpose: keeps the workspace manifest untouched.
# Compatible with the workspace tree-sitter 0.26 line.
tree-sitter-python = "0.25.0"
tree-sitter-c = "0.24.2"
tree-sitter-go = "0.25.0"
clap = { workspace = true, features = ["derive"] }
askama = {workspace = true}
serde = { workspace = true }
prettyplease = "0.2"
proc-macro2 = { version = "1", features = ["span-locations"] }
syn = { version = "2", features = ["full", "visit"] }
paste = { workspace = true }
mudu_binding = {workspace = true}
[build-dependencies]
tree-sitter = { workspace = true }
tree-sitter-wit = { workspace = true }
mudu_build_common = { workspace = true }
serde = { workspace = true }
# Build scripts always run on the native backend (real env / real fs).
mudu_sys_impl = { workspace = true }
[lib]
path = "src/lib.rs"

[[bin]]
name = "mgen"
path = "tool/main.rs"

