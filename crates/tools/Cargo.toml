[workspace]
resolver = "2"

members = [
    "mpm_build",
    "mpm_crate",
    "mpm_install",
    "mudu_cli",
    "mudu_gen",
    "mudu_transpiler",
]

[workspace.package]
rust-version = "1.96"

[workspace.lints.rust]
future_incompatible = { level = "allow", priority = -1 }
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }

[workspace.lints.clippy]
disallowed-types = "deny"

[profile.release]
panic = "abort"

# Line-tables-only debug info: keeps backtrace line numbers while cutting
# link-time memory and target-dir size several-fold (full `debug = 2` is the
# main driver of linker OOM kills when building this workspace's test
# binaries in memory-constrained environments).
[profile.dev]
debug = 1

[workspace.dependencies]
# Crates in this workspace.
mpm_build = { path = "mpm_build" }
mpm_crate = { path = "mpm_crate" }
mpm_install = { path = "mpm_install" }
mudu_cli = { path = "mudu_cli" }
mudu_gen = { path = "mudu_gen" }
mudu_transpiler = { path = "mudu_transpiler" }

# Crates from the sibling common workspace.
mudu = { path = "../common/mudu" }
mudu_binding = { path = "../common/mudu_binding" }
mudu_build_common = { path = "../common/mudu_build_common" }
mudu_client = { path = "../common/mudu_client" }
mudu_contract = { path = "../common/mudu_contract" }
mudu_sys = { path = "../common/mudu_sys" }
mudu_sys_impl = { path = "../common/mudu_sys_impl" }
mudu_type = { path = "../common/mudu_type" }
mudu_utils = { path = "../common/mudu_utils" }
sql_parser = { path = "../common/sql_parser" }
tree-sitter-wit = { path = "../common/tree-sitter-wit" }

# External dependencies.
anyhow = { version = "1.0.103" }
askama = { version = "0.16.0" }
async-trait = { version = "0.1.89" }
cargo_metadata = { version = "0.23.1" }
clap = { version = "4.5.50" }
crossterm = { version = "0.29.0" }
paste = { version = "1.0.15" }
ratatui = { version = "0.30.2" }
rustyline = { version = "18.0.0" }
serde = { version = "1.0.228", features = ["default", "derive", "serde_derive"] }
serde_json = { version = "1.0.145", features = ["preserve_order"] }
syn = { version = "2.0.111", features = ["full"] }
tempfile = { version = "3.23" }
tree-sitter = { version = "0.26.2" }
tree-sitter-c-sharp = { version = "0.23.5" }
tree-sitter-rust = { version = "0.24.0" }
tree-sitter-typescript = { version = "0.23.2" }
unicode-width = { version = "0.2.0" }
wit-parser = { version = "0.252.0" }
zip = { version = "8.4.0" }
