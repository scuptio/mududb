[workspace]
resolver = "2"

members = [
    "mudu_adapter",
    "mudu_kernel",
    "mudu_runtime",
    "mudud",
    "sys_interface_standalone",
    "testing",
]

[workspace.package]
rust-version = "1.96"

[workspace.lints.rust]
future_incompatible = { level = "allow", priority = -1 }
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }

[workspace.lints.clippy]
disallowed-types = "deny"

[profile.release]
panic = "abort"

# Line-tables-only debug info: keeps backtrace line numbers while cutting
# link-time memory and target-dir size several-fold (full `debug = 2` is the
# main driver of linker OOM kills when building this workspace's test
# binaries in memory-constrained environments).
[profile.dev]
debug = 1

[workspace.dependencies]
# Crates in this workspace.
mudu_adapter = { path = "mudu_adapter" }
mudu_kernel = { path = "mudu_kernel" }
mudu_runtime = { path = "mudu_runtime" }
mudud = { path = "mudud" }
sys_interface_standalone = { path = "sys_interface_standalone" }
testing = { path = "testing" }

# Crates from the sibling common workspace.
mudu = { path = "../common/mudu" }
mudu_binding = { path = "../common/mudu_binding" }
mudu_client = { path = "../common/mudu_client" }
mudu_compat_migrate = { path = "../common/mudu_compat_migrate" }
mudu_contract = { path = "../common/mudu_contract" }
mudu_sys = { path = "../common/mudu_sys" }
mudu_type = { path = "../common/mudu_type" }
mudu_utils = { path = "../common/mudu_utils" }
sql_parser = { path = "../common/sql_parser" }
sys_interface = { path = "../common/sys_interface" }
test_utils = { path = "../common/test_utils" }

# Crates from the sibling tools workspace.
mudu_cli = { path = "../tools/mudu_cli" }

# External dependencies.
actix-cors = { version = "0.7.1" }
actix-web = { version = "4.11.0" }
arbitrary = { version = "1.4.2", features = ["derive", "derive_arbitrary"] }
async-backtrace = { version = "0.2.7" }
async-trait = { version = "0.1.89" }
base64 = { version = "0.22.1" }
bigdecimal = { version = "0.4.10" }
byteorder = { version = "1.5.0" }
bytes = { version = "1.10.1" }
clap = { version = "4.5.50" }
crossbeam-queue = { version = "0.3.11" }
csv = { version = "1.3.1" }
futures = { version = "0.3.31" }
lazy_static = { version = "1.5.0" }
libc = { version = "0.2.164" }
libsql = { version = "0.10.0-pre.4" }
mysql = { version = "28.0.0" }
mysql_async = { version = "0.37.0" }
pgwire = { version = "0.40.3", default-features = false, features = ["server-api-ring", "pg-ext-types"] }
postgres = { version = "0.19.10" }
project-root = { version = "0.2.2" }
reqwest = { version = "0.13.2", features = ["json"] }
rmp-serde = { version = "1.3.0" }
rusqlite = { version = "0.40.1" }
scc = { version = "3.3.1" }
scopeguard = { version = "1.2.0" }
serde = { version = "1.0.228", features = ["default", "derive", "serde_derive"] }
serde_json = { version = "1.0.145", features = ["preserve_order"] }
serde_repr = { version = "0.1.20" }
short-uuid = { version = "0.2.0" }
strum = { version = "0.28.0" }
strum_macros = { version = "0.28.0" }
tempfile = { version = "3.23" }
thiserror = { version = "2.0.17" }
tokio = { version = "1.47.1", features = ["full"] }
tokio-postgres = { version = "0.7.15" }
toml = { version = "1.1.0", features = ["preserve_order"] }
tracing = { version = "0.1.43" }
tracing-subscriber = { version = "0.3.20" }
uniffi = { version = "0.31.0", features = ["scaffolding-ffi-buffer-fns"] }
uuid = { version = "1.18.1", features = ["v4", "js"] }
zip = { version = "8.4.0" }

# wasmtime family (features preserved in consuming crates).
# Floor at 46.0.2: 46.0.1 is flagged by RUSTSEC-2026-0222 / RUSTSEC-2026-0223.
wasmtime = { version = "46.0.2" }
wasmtime-wasi = { version = "46.0.2" }
