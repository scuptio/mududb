[package]
name = "meta"
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
description = "In-memory catalog managers for schemas, partitions, rules, and placements"

[features]
test = ["catalog/test", "dep:arbitrary"]
debug_trace = ["mudu_utils/debug_trace"]

[lints]
workspace = true

[dependencies]
catalog = { workspace = true }
storage = { workspace = true }
mudu = { workspace = true }
mudu_contract = { workspace = true }
mudu_sys = { workspace = true }
mudu_type = { workspace = true }
mudu_utils = { workspace = true }
async-trait = { workspace = true }
rmp-serde = { workspace = true }
scc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
arbitrary = { workspace = true, optional = true }

[dev-dependencies]
arbitrary = { workspace = true }
