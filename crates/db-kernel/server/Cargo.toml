[package]
name = "server"
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
description = "TCP server backend with a Linux-first io_uring implementation"

[features]
debug_trace = ["mudu_utils/debug_trace"]
ds = ["mudu_sys/ds"]

[lints]
workspace = true

[dependencies]
backup = { workspace = true }
catalog = { workspace = true }
conn = { workspace = true }
index = { workspace = true }
meta = { workspace = true }
repl = { workspace = true }
sql = { workspace = true }
storage = { workspace = true }
wal = { workspace = true }
worker = { workspace = true }
xcontract = { workspace = true }
xengine = { workspace = true }
mudu = { workspace = true }
mudu_binding = { workspace = true }
mudu_contract = { workspace = true }
mudu_sys = { workspace = true }
mudu_type = { workspace = true }
mudu_utils = { workspace = true }
sql_parser = { workspace = true }
async-trait = { workspace = true }
crossbeam-queue = { workspace = true }
futures = { workspace = true }
lazy_static = { workspace = true }
libc = { workspace = true }
serde_json = { workspace = true }
short-uuid = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
catalog-testing = { workspace = true }
worker = { workspace = true, features = ["test"] }
serde_json = { workspace = true }
