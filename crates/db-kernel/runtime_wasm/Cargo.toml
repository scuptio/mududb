[package]
name = "runtime_wasm"
version = "0.0.1"
edition = "2024"
rust-version.workspace = true
license = "Apache-2.0"
description = "WebAssembly procedure host: component loading, guest/host interface, app packages"

[features]
debug_trace = ["mudu_utils/debug_trace"]
# Pass-through for the deterministic-simulation backend (`-F mudu_sys/ds`).
# Tests that exercise real-OS semantics the simulator cannot provide are
# gated with `#[cfg(not(feature = "ds"))]`.
ds = ["mudu_sys/ds"]

[lints]
workspace = true

[dependencies]
catalog = { workspace = true }
conn = { workspace = true }
server = { workspace = true }
xengine = { workspace = true }
runtime_libsql = { workspace = true }
mudu = { workspace = true }
mudu_binding = { workspace = true }
mudu_contract = { workspace = true }
mudu_sys = { workspace = true }
mudu_type = { workspace = true }
mudu_utils = { workspace = true }
sql_parser = { workspace = true }
as-slice = { version = "0.2.1" }
async-trait = { workspace = true }
lazy_static = { workspace = true }
scc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
wasmtime = { workspace = true, features = ["async"] }
wasmtime-wasi = { workspace = true, features = ["p2"] }
zip = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]

[dev-dependencies]
bytes = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
