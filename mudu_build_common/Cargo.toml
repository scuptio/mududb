[package]
name = "mudu_build_common"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license = "Apache-2.0"
publish = false

[lints]
workspace = true

[dependencies]
mudu = { workspace = true }
# Build-time tooling always uses the native backend directly: build scripts
# need the real process env (CARGO_MANIFEST_DIR, OUT_DIR) and the real fs,
# even when the workspace is built with the `mudu_sys/ds` simulation backend.
mudu_sys_impl = { workspace = true }
toml = { workspace = true }
serde_json = { workspace = true }
md-5 = { workspace = true }
base16ct = { workspace = true }
tree-sitter = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tree_sitter_sql = { workspace = true }
