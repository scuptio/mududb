# Single source of truth for external dependency versions shared across two or
# more of the four group workspaces (crates/{common,db-kernel,sdk,tools}).
#
# Each entry below is a dependency that is declared in at least two group
# workspaces' `[workspace.dependencies]`. The spec recorded here is canonical:
# `script/ci/sync_workspace_deps.py` rewrites the corresponding lines in the
# four `Cargo.toml` files to match, and its `--check` mode (run by
# `script/shell/check_all.sh` and CI) fails if any of them drift.
#
# DO NOT edit the external-dependency lines in crates/*/Cargo.toml by hand for
# any key listed here. To change a version or feature set, edit this file and
# run:
#
#   python3 script/ci/sync_workspace_deps.py
#
# Dependencies used by only a single workspace (e.g. actix-web, mysql, anyhow,
# rliburing) are intentionally NOT listed here; they stay in their workspace's
# own `[workspace.dependencies]` block.

[versions]
arbitrary = { version = "1.4.2", features = ["derive", "derive_arbitrary"] }
async-backtrace = { version = "0.2.7" }
async-trait = { version = "0.1.89" }
base64 = { version = "0.23.1" }
bigdecimal = { version = "0.4.10" }
byteorder = { version = "1.5.0" }
bytes = { version = "1.10.1" }
chrono = { version = "0.4.42" }
clap = { version = "4.5.50" }
crossbeam-queue = { version = "0.3.11" }
fallible-iterator = { version = "0.3.0" }
futures = { version = "0.3.31" }
lazy_static = { version = "1.5.0" }
libc = { version = "0.2.164" }
paste = { version = "1.0.15" }
project-root = { version = "0.2.2" }
reqwest = { version = "0.13.2", features = ["json"] }
rmp = { version = "0.8.15" }
rmp-serde = { version = "1.3.0" }
rusqlite = { version = "0.40.1" }
scc = { version = "3.3.1" }
serde = { version = "1.0.228", features = ["default", "derive", "serde_derive"] }
serde_json = { version = "1.0.145", features = ["preserve_order"] }
serde_repr = { version = "0.1.20" }
strum = { version = "0.28.0" }
tempfile = { version = "3.23" }
tokio = { version = "1.47.1", features = ["full"] }
toml = { version = "1.1.0", features = ["preserve_order"] }
tracing = { version = "0.1.43" }
tracing-subscriber = { version = "0.3.20" }
tree-sitter = { version = "0.26.2" }
uuid = { version = "1.18.1", features = ["v4", "js"] }
wit-bindgen = { version = "0.58.0" }
zip = { version = "9.0.1" }
