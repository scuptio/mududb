# The extraction root imports this exact production source, without substitutions.
#
# Registry schema (validated by script/verification/check.py validate_registry):
# - status: "proven" (theorems + sanity audited) or "extracted" (drift-checked only)
# - owner: free-form owning area, non-empty
# - assumptions: trust-boundary notes believed but not machine-checked; the list
#   must be present even when empty so the decision is explicit
# - sanity: theorems proving the specification is satisfiable on concrete inputs;
#   audited with the same axiom rules as `theorems`; required when status=proven
# - premises: proof preconditions that the integration layer must establish, each
#   with `established_by` references as "<path>" or "<path>::<symbol>" pointing at
#   the Rust test or assertion that discharges it
[target.buf]
source = "crates/common/mudu/src/utils/buf.rs"
entry = "verification/extract/Cargo.toml"
# Module name under which the extraction crate exposes the production source.
extract_module = "buf"
platform = "x86_64-unknown-linux-gnu"
features = []
functions = ["sized_buf_len", "write_sized_buf", "read_sized_buf"]
module = "crates.common.mudu.src.utils.buf.proof"
status = "proven"
allowed_axioms = ["propext", "Classical.choice", "Quot.sound"]
owner = "mudu"
assumptions = [
  "usize is 64-bit on the pinned x86_64-unknown-linux-gnu extraction target",
]
# Completed proof names are checked by the verification runner.
theorems = [
  "sized_buf_proof.length_correct",
  "sized_buf_proof.write_success",
  "sized_buf_proof.write_overflow",
  "sized_buf_proof.write_short",
  "sized_buf_proof.read_short_header",
  "sized_buf_proof.read_success",
  "sized_buf_proof.read_overflow",
  "sized_buf_proof.read_truncated",
  "sized_buf_proof.decode_header_append",
  "sized_buf_proof.roundtrip",
]
sanity = [
  "sized_buf_proof.sanity_roundtrip",
  "sized_buf_proof.sanity_write_short",
]

[[target.buf.premises]]
note = "Error values and the big-endian header layout observed by callers match the proved model"
established_by = [
  "crates/common/mudu/src/utils/buf_test.rs::length_header_uses_all_big_endian_bytes",
  "crates/common/mudu/src/utils/buf_test.rs::errors_preserve_output_and_success_preserves_tail",
]

