name: Nightly Checks

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**/*.md'
      - 'doc/**'
  pull_request:
    branches: [ main, master ]
    paths-ignore:
      - '**/*.md'
      - 'doc/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0

defaults:
  run:
    shell: bash

jobs:
  cargo-udeps:
    name: cargo-udeps - ${{ matrix.group }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Each group workspace has its own Cargo.lock and is checked separately.
        group: [ common, db-kernel, sdk, tools ]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup pinned nightly tooling Rust
        uses: ./.github/actions/rust-nightly-setup

      - name: Install cargo-udeps
        run: cargo +${NIGHTLY_TOOLCHAIN} install cargo-udeps --version 0.1.61 --locked

      - name: Run cargo-udeps
        working-directory: crates/${{ matrix.group }}
        run: |
          mkdir -p ${{ github.workspace }}/logs
          set -o pipefail
          cargo +${NIGHTLY_TOOLCHAIN} udeps --workspace --all-targets 2>&1 | tee ${{ github.workspace }}/logs/nightly-udeps-${{ matrix.group }}.log

      - name: Local reproduction command
        if: failure()
        run: |
          echo "To reproduce locally:"
          echo "  NIGHTLY_TOOLCHAIN=\"$(tr -d '[:space:]' < .rust-nightly-version)\""
          echo "  rustup toolchain install \"\${NIGHTLY_TOOLCHAIN}\" --profile minimal"
          echo "  cargo +\${NIGHTLY_TOOLCHAIN} install cargo-udeps --version 0.1.61 --locked"
          echo "  cd crates/${{ matrix.group }}"
          echo "  cargo +\${NIGHTLY_TOOLCHAIN} udeps --workspace --all-targets"

  cargo-fuzz:
    name: cargo-fuzz
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Free disk space
        if: env.ACT != 'true'
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          docker system prune -af || true
          df -h

      - name: Setup pinned nightly tooling Rust
        uses: ./.github/actions/rust-nightly-setup

      - name: Install cargo-fuzz
        run: cargo +${NIGHTLY_TOOLCHAIN} install cargo-fuzz --version 0.13.2 --locked

      - name: Run fuzz targets (smoke)
        working-directory: crates/db-kernel/mudu_kernel/fuzz
        run: |
          mkdir -p ${{ github.workspace }}/logs
          set -o pipefail
          {
            for target in _de_en_x_l_up_tuple _de_en_x_l_batch _schema_table _x_log_append _delta_apply _type_convert; do
              echo "Running fuzz target: ${target}"
              cargo +${NIGHTLY_TOOLCHAIN} fuzz run "${target}" -- -max_total_time=60 -runs=1000
            done
          } 2>&1 | tee ${{ github.workspace }}/logs/nightly-fuzz.log

      - name: Local reproduction command
        if: failure()
        run: |
          echo "To reproduce locally:"
          echo "  NIGHTLY_TOOLCHAIN=\"$(tr -d '[:space:]' < .rust-nightly-version)\""
          echo "  rustup toolchain install \"\${NIGHTLY_TOOLCHAIN}\" --profile minimal"
          echo "  cargo +\${NIGHTLY_TOOLCHAIN} install cargo-fuzz --version 0.13.2 --locked"
          echo "  cd crates/db-kernel/mudu_kernel/fuzz"
          echo "  cargo +\${NIGHTLY_TOOLCHAIN} fuzz run <target> -- -max_total_time=60"

  sanitizer-address:
    name: Address Sanitizer
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      MUDU_CLI_HTTP_TIMEOUT_SECS: 120
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Free disk space
        if: env.ACT != 'true'
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          docker system prune -af || true
          df -h

      - name: Setup pinned nightly tooling Rust
        uses: ./.github/actions/rust-nightly-setup

      - name: Run tests with AddressSanitizer
        run: |
          mkdir -p ${{ github.workspace }}/logs
          set -o pipefail
          {
            # Run every group even if one fails, but propagate any failure:
            # the pipeline status must not be decided by the last group alone.
            failed=0
            for group in crates/common crates/db-kernel crates/sdk crates/tools; do
              echo "=== ASan tests: ${group} ==="
              (cd "${group}" && cargo +${NIGHTLY_TOOLCHAIN} test --workspace --lib --tests --bins --target x86_64-unknown-linux-gnu) || failed=1
            done
            exit "${failed}"
          } 2>&1 | tee ${{ github.workspace }}/logs/nightly-asan.log
        env:
          RUSTFLAGS: "-Z sanitizer=address"
          LSAN_OPTIONS: "suppressions=${{ github.workspace }}/script/ci/lsan_suppressions.txt"

      - name: Local reproduction command
        if: failure()
        run: |
          echo "To reproduce locally:"
          echo "  NIGHTLY_TOOLCHAIN=\"$(tr -d '[:space:]' < .rust-nightly-version)\""
          echo "  rustup toolchain install \"\${NIGHTLY_TOOLCHAIN}\" --profile minimal"
          echo "  rustup target add x86_64-unknown-linux-gnu --toolchain \${NIGHTLY_TOOLCHAIN}"
          echo "  cd crates/<group>   # one of: common db-kernel sdk tools"
          echo "  RUSTFLAGS=\"-Z sanitizer=address\" LSAN_OPTIONS=\"suppressions=$(pwd)/script/ci/lsan_suppressions.txt\" MUDU_CLI_HTTP_TIMEOUT_SECS=120 cargo +\${NIGHTLY_TOOLCHAIN} test --workspace --lib --tests --bins --target x86_64-unknown-linux-gnu"

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      MUDU_TEST_BACKEND_READY_TIMEOUT_SECS: 120
      MUDU_CLI_HTTP_TIMEOUT_SECS: 120
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Free disk space
        if: env.ACT != 'true'
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          docker system prune -af || true
          df -h

      - name: Setup pinned nightly tooling Rust
        uses: ./.github/actions/rust-nightly-setup

      - name: Install llvm-tools-preview
        run: rustup component add llvm-tools-preview --toolchain "${NIGHTLY_TOOLCHAIN}"

      - name: Install cargo-llvm-cov
        run: cargo +"${NIGHTLY_TOOLCHAIN}" install cargo-llvm-cov --version 0.8.7 --locked

      - name: Run coverage (per group workspace)
        run: |
          mkdir -p ${{ github.workspace }}/logs
          set -o pipefail
          # The core packages (mudu, mudu_type, mudu_contract, mudu_kernel) are
          # split across the crates/common and crates/db-kernel workspaces;
          # the script runs llvm-cov per group and writes reports to
          # target/llvm-cov/<group>/.
          bash script/coverage/run_coverage.sh --profile core --format all 2>&1 | tee ${{ github.workspace }}/logs/nightly-coverage.log

      - name: Upload coverage artifacts
        if: env.ACT != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_id }}-${{ github.sha }}
          path: |
            target/llvm-cov/*/html
            target/llvm-cov/*/coverage.json
            target/llvm-cov/*/coverage.lcov
          retention-days: 30

      - name: Summarize coverage in job summary
        if: env.ACT != 'true'
        run: |
          echo "## Coverage Report" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Artifact: coverage-${{ github.run_id }}-${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          for json in target/llvm-cov/*/coverage.json; do
            echo "### ${json}" >> "$GITHUB_STEP_SUMMARY"
            python3 .github/scripts/summarize_coverage.py "${json}" >> "$GITHUB_STEP_SUMMARY" || true
          done

      - name: Local reproduction command
        if: failure()
        run: |
          echo "To reproduce locally:"
          echo "  bash script/coverage/run_coverage.sh --profile core --format all"
