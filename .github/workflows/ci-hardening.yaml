name: CI Hardening

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**/*.md'
      - 'doc/**'
  pull_request:
    branches: [ main, master ]
    paths-ignore:
      - '**/*.md'
      - 'doc/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  format:
    name: cargo-fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup pinned stable Rust
        uses: ./.github/actions/rust-stable-setup

      - name: Check formatting
        run: |
          mkdir -p logs
          set -o pipefail
          {
            for group in crates/common crates/db-kernel crates/sdk crates/tools; do
              echo "=== cargo fmt --check: ${group} ==="
              (cd "${group}" && cargo fmt -- --check)
            done
          } 2>&1 | tee logs/hardening-fmt.log

  cargo-deny:
    name: cargo-deny - ${{ matrix.group }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Each group workspace has its own Cargo.lock and must be checked
        # separately; deny.toml stays at the repository root.
        group: [ common, db-kernel, sdk, tools ]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup pinned stable Rust
        uses: ./.github/actions/rust-stable-setup

      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.19.9 --locked

      - name: Run cargo-deny
        working-directory: crates/${{ matrix.group }}
        run: |
          mkdir -p ${{ github.workspace }}/logs
          set -o pipefail
          cargo deny check --config ${{ github.workspace }}/deny.toml bans licenses advisories sources 2>&1 | tee ${{ github.workspace }}/logs/hardening-deny-${{ matrix.group }}.log

  cargo-hack:
    name: cargo-hack
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup pinned stable Rust
        uses: ./.github/actions/rust-stable-setup

      - name: Install cargo-hack
        run: cargo install cargo-hack --version 0.6.45 --locked

      # The workspace currently has pre-existing feature-interaction issues in
      # external crates (e.g. icu_normalizer, async-backtrace, zip) when checking
      # individual feature combinations. Keep this job visible but non-blocking
      # until those upstream/feature issues are resolved.
      - name: Check feature combinations
        run: |
          mkdir -p logs
          set -o pipefail
          {
            for group in crates/common crates/db-kernel crates/sdk crates/tools; do
              echo "=== cargo hack: ${group} ==="
              (cd "${group}" && cargo hack check --workspace --each-feature --no-dev-deps)
            done
          } 2>&1 | tee logs/hardening-hack.log
        continue-on-error: true

  cargo-outdated:
    name: cargo-outdated
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup pinned stable Rust
        uses: ./.github/actions/rust-stable-setup

      - name: Install cargo-outdated
        run: cargo install cargo-outdated --version 0.19.0 --locked

      # Kept visible but non-blocking until this job is re-measured on a
      # fresh runner.
      - name: Check outdated dependencies
        run: |
          mkdir -p logs
          set -o pipefail
          {
            for group in crates/common crates/db-kernel crates/sdk crates/tools; do
              echo "=== cargo outdated: ${group} ==="
              (cd "${group}" && cargo outdated --workspace --root-deps-only)
            done
          } 2>&1 | tee logs/hardening-outdated.log
        continue-on-error: true
