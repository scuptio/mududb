name: Build

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**/*.md'
      - 'doc/**'
      - '.github/run-actions-locally.md'
  pull_request:
    branches: [ main, master ]
    paths-ignore:
      - '**/*.md'
      - 'doc/**'
      - '.github/run-actions-locally.md'
  workflow_dispatch:
    inputs:
      clean_cargo:
        description: 'Run cargo clean before build'
        required: false
        type: boolean
        default: false
      release_test:
        description: 'Run tests in release mode'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build - ${{ matrix.os }} - ${{ matrix.group }}
    runs-on: ${{ matrix.os }}
    env:
      ENABLE_CARGO_CLEAN: ${{ github.event.inputs.clean_cargo || 'false' }}
      ENABLE_RELEASE_TEST: ${{ github.event.inputs.release_test || 'true' }}
      CARGO_INCREMENTAL: 0
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_PROFILE_RELEASE_DEBUG: 0
      MUDU_TEST_BACKEND_READY_TIMEOUT_SECS: 120
      MUDU_CLI_HTTP_TIMEOUT_SECS: 120
    strategy:
      matrix:
        os: [ ubuntu-latest ]
        # The repository has no root workspace; each group is an independent
        # cargo workspace with its own Cargo.lock. The guest-SDK examples
        # live in their own workspace at example/mpk.
        group: [ crates/common, crates/db-kernel, crates/sdk, example/mpk, crates/tools ]
        include:
          - os: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
    defaults:
      run:
        shell: bash
        working-directory: ${{ matrix.group }}

    steps:
      - name: Checkout Code
        id: checkout
        uses: actions/checkout@v5

      - name: Initialize job report
        id: initialize_job_report
        shell: bash
        working-directory: ${{ github.workspace }}
        run: python3 script/ci/workflow_report.py init

      - name: Setup pinned stable Rust
        id: setup
        if: matrix.os == 'ubuntu-latest'
        uses: ./.github/actions/rust-stable-setup

      - name: Free disk space
        shell: python3 -c "import os,runpy; runpy.run_path(os.environ['MUDU_WORKFLOW_REPORT'],run_name='__main__')" run free_disk bash {0}
        id: free_disk
        if: matrix.os == 'ubuntu-latest'
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          docker system prune -af || true
          df -h

      - name: Cache Cargo Registry
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-stable-${{ matrix.group }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-stable-${{ matrix.group }}

      - name: Clean cargo cache (optional)
        shell: python3 -c "import os,runpy; runpy.run_path(os.environ['MUDU_WORKFLOW_REPORT'],run_name='__main__')" run clean bash {0}
        id: clean
        if: env.ENABLE_CARGO_CLEAN == 'true'
        run: |
          mkdir -p ${{ github.workspace }}/logs/${{ matrix.group }}
          set -o pipefail
          cargo clean 2>&1 | tee ${{ github.workspace }}/logs/${{ matrix.group }}/build-clean.log

      - name: Check (debug)
        shell: python3 -c "import os,runpy; runpy.run_path(os.environ['MUDU_WORKFLOW_REPORT'],run_name='__main__')" run check_debug bash {0}
        id: check_debug
        if: env.ENABLE_RELEASE_TEST != 'true'
        run: |
          mkdir -p ${{ github.workspace }}/logs/${{ matrix.group }}
          set -o pipefail
          cargo check 2>&1 | tee ${{ github.workspace }}/logs/${{ matrix.group }}/build-check-debug.log

      - name: Check (release)
        shell: python3 -c "import os,runpy; runpy.run_path(os.environ['MUDU_WORKFLOW_REPORT'],run_name='__main__')" run check_release bash {0}
        id: check_release
        if: env.ENABLE_RELEASE_TEST == 'true'
        run: |
          mkdir -p ${{ github.workspace }}/logs/${{ matrix.group }}
          set -o pipefail
          cargo check --release 2>&1 | tee ${{ github.workspace }}/logs/${{ matrix.group }}/build-check-release.log

      - name: Clippy
        shell: python3 -c "import os,runpy; runpy.run_path(os.environ['MUDU_WORKFLOW_REPORT'],run_name='__main__')" run clippy bash {0}
        id: clippy
        run: |
          mkdir -p ${{ github.workspace }}/logs/${{ matrix.group }}
          set -o pipefail
          cargo clippy --workspace --all-targets -- -D warnings 2>&1 | tee ${{ github.workspace }}/logs/${{ matrix.group }}/build-clippy.log

      - name: Verify Install Script (Linux)
        shell: python3 -c "import os,runpy; runpy.run_path(os.environ['MUDU_WORKFLOW_REPORT'],run_name='__main__')" run install bash {0}
        id: install
        if: matrix.os == 'ubuntu-latest' && matrix.group == 'crates/tools'
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p logs
          set -o pipefail
          python3 script/build/install_binaries.py --dry-run 2>&1 | tee logs/build-verify-install.log

      - name: Inspect io_uring Environment (Linux)
        shell: python3 -c "import os,runpy; runpy.run_path(os.environ['MUDU_WORKFLOW_REPORT'],run_name='__main__')" run iouring bash {0}
        id: iouring
        if: matrix.os == 'ubuntu-latest' && matrix.group == 'crates/db-kernel'
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p logs
          set -o pipefail
          bash script/build/inspect_iouring_env.sh 2>&1 | tee logs/build-inspect-iouring.log

      - name: Test (debug)
        shell: python3 -c "import os,runpy; runpy.run_path(os.environ['MUDU_WORKFLOW_REPORT'],run_name='__main__')" run test_debug bash {0}
        id: test_debug
        if: env.ENABLE_RELEASE_TEST != 'true'
        run: |
          mkdir -p ${{ github.workspace }}/logs/${{ matrix.group }}
          set -o pipefail
          cargo test -- --test-threads=1 2>&1 | tee ${{ github.workspace }}/logs/${{ matrix.group }}/build-test-debug.log

      - name: Test (release)
        shell: python3 -c "import os,runpy; runpy.run_path(os.environ['MUDU_WORKFLOW_REPORT'],run_name='__main__')" run test_release bash {0}
        id: test_release
        if: env.ENABLE_RELEASE_TEST == 'true'
        run: |
          mkdir -p ${{ github.workspace }}/logs/${{ matrix.group }}
          set -o pipefail
          cargo test --release -- --test-threads=1 2>&1 | tee ${{ github.workspace }}/logs/${{ matrix.group }}/build-test-release.log

      - name: Report job failures
        if: always()
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          REPORT_STEPS: ${{ toJSON(steps) }}
          REPORT_MATRIX: ${{ toJSON(matrix) }}
        run: python3 script/ci/workflow_report.py report

  rustdoc:
    name: Rustdoc
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - name: Checkout Code
        id: checkout_code
        uses: actions/checkout@v5

      - name: Initialize job report
        id: initialize_job_report
        shell: bash
        working-directory: ${{ github.workspace }}
        run: python3 script/ci/workflow_report.py init

      - name: Setup pinned stable Rust
        id: setup_pinned_stable_rust
        uses: ./.github/actions/rust-stable-setup

      - name: Cache Cargo Registry
        id: cache_cargo_registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-doc-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-doc

      - name: Generate documentation
        shell: python3 -c "import os,runpy; runpy.run_path(os.environ['MUDU_WORKFLOW_REPORT'],run_name='__main__')" run generate_documentation bash {0}
        id: generate_documentation
        run: |
          # No root workspace exists; document each group workspace in turn.
          for group in crates/common crates/db-kernel crates/sdk crates/tools; do
            echo "=== cargo doc: ${group} ==="
            (cd "${group}" && cargo doc --workspace --no-deps)
          done
      - name: Report job failures
        if: always()
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          REPORT_STEPS: ${{ toJSON(steps) }}
          REPORT_MATRIX: ${{ toJSON(matrix) }}
        run: python3 script/ci/workflow_report.py report
