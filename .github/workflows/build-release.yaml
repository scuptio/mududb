name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

defaults:
  run:
    shell: bash

jobs:
  build-release:
    name: Build Release - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        include:
          - os: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu

    steps:
      - name: Checkout Code
        id: checkout_code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Initialize job report
        id: initialize_job_report
        shell: bash
        working-directory: ${{ github.workspace }}
        run: python3 script/ci/workflow_report.py init

      - name: Resolve Release Version
        shell: python3 -c "import os,runpy; runpy.run_path(os.environ['MUDU_WORKFLOW_REPORT'],run_name='__main__')" run version bash {0}
        id: version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" && -n "${GITHUB_REF_NAME}" ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="v$(date -u +'%Y%m%d.%H%M')"
          fi
          echo "tag=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${VERSION}"

      - name: Setup pinned stable Rust
        id: setup_pinned_stable_rust
        if: matrix.os == 'ubuntu-latest'
        uses: ./.github/actions/rust-stable-setup

      - name: Cache Cargo Registry
        id: cache_cargo_registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release

      # Packaging lives in script/release/package_release.py (the same
      # implementation as `cargo make package-release`): build the release
      # binaries, collect binaries + prerequisite scripts, write the manifest,
      # and emit the tarball, checksums, and changelog.
      - name: Package Release
        shell: python3 -c "import os,runpy; runpy.run_path(os.environ['MUDU_WORKFLOW_REPORT'],run_name='__main__')" run package_release bash {0}
        id: package_release
        run: |
          python3 script/release/package_release.py \
            --version "${{ steps.version.outputs.version }}" \
            --target "${{ matrix.rust_target }}" \
            --repository "${{ github.repository }}"

      - name: Normalize Local Artifact Ownership
        shell: python3 -c "import os,runpy; runpy.run_path(os.environ['MUDU_WORKFLOW_REPORT'],run_name='__main__')" run normalize_local_artifact_ownership bash {0}
        id: normalize_local_artifact_ownership
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ARTIFACT_ROOT="target/release-artifacts"
          ARTIFACT_DIR="${ARTIFACT_ROOT}/${VERSION}"

          # When act runs with --bind as root, keep generated local files owned by
          # the host checkout owner instead of root.
          if [[ "$(id -u)" -eq 0 ]]; then
            WORKSPACE_OWNER="$(stat -c '%u:%g' "${GITHUB_WORKSPACE:-.}")"
            chown "${WORKSPACE_OWNER}" "${ARTIFACT_ROOT}" || true
            chown -R "${WORKSPACE_OWNER}" "${ARTIFACT_DIR}"
          fi

      - name: Create GitHub Release
        id: create_github_release
        if: ${{ env.GITHUB_TOKEN != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "MuduDB ${{ steps.version.outputs.version }}"
          body_path: target/release-artifacts/${{ steps.version.outputs.version }}/CHANGELOG_RELEASE.md
          files: |
            target/release-artifacts/${{ steps.version.outputs.version }}/*.tar.gz
            target/release-artifacts/${{ steps.version.outputs.version }}/*.sha256
          draft: false
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: false

      - name: Skip GitHub Release
        shell: python3 -c "import os,runpy; runpy.run_path(os.environ['MUDU_WORKFLOW_REPORT'],run_name='__main__')" run skip_github_release bash {0}
        id: skip_github_release
        if: ${{ env.GITHUB_TOKEN == '' }}
        run: |
          echo "GITHUB_TOKEN is not set; skipping GitHub release publishing."

      - name: Verify Release Assets
        shell: python3 -c "import os,runpy; runpy.run_path(os.environ['MUDU_WORKFLOW_REPORT'],run_name='__main__')" run verify_release_assets bash {0}
        id: verify_release_assets
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ARTIFACT_DIR="target/release-artifacts/${VERSION}"

          echo "Release artifacts:"
          ls -lh "${ARTIFACT_DIR}/"
          echo ""
          echo "Checksums:"
          cat "${ARTIFACT_DIR}"/*.sha256 || true
      - name: Report job failures
        if: always()
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          REPORT_STEPS: ${{ toJSON(steps) }}
          REPORT_MATRIX: ${{ toJSON(matrix) }}
        run: python3 script/ci/workflow_report.py report
