# Generated by Codex. Scan history before SDK builds receive permission to run.
name: Secret Scan

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  scan:
    name: Scan secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      # The gitleaks release tarball changes only when the pinned version
      # does, so cache it and skip the network entirely on a hit; GitHub's
      # release endpoint intermittently returns 504s for minutes at a time.
      # Skipped under act, which has no cache service.
      - name: Cache checksum-pinned Gitleaks CLI
        if: env.ACT != 'true'
        uses: actions/cache@v4
        with:
          path: ~/gitleaks-bin
          key: gitleaks-8.24.3-9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
      - name: Install checksum-pinned Gitleaks CLI
        shell: bash
        run: |
          set -euo pipefail
          tool_dir="$HOME/gitleaks-bin"
          tarball="$tool_dir/gitleaks.tar.gz"
          mkdir -p "$tool_dir"
          if [ ! -f "$tarball" ]; then
            # A GitHub 504 blip can outlast curl's default retry window
            # (about 7 seconds); use a window long enough to ride it out.
            curl --fail --silent --show-error --location \
              --retry 8 --retry-delay 10 --retry-max-time 300 \
              https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
              --output "$tarball"
          fi
          printf '%s  %s\n' \
            9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c \
            "$tarball" | sha256sum --check --strict
          tar -xzf "$tarball" -C "$tool_dir" gitleaks
          echo "$tool_dir" >> "$GITHUB_PATH"
      - name: Scan all fetched Git history
        run: python3 script/ci/check_secrets.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test SDK credential rejection
        run: python3 -m unittest discover -s script/sdk/tests -v
      - name: Test scanner detection and redaction
        run: python3 script/ci/test_secret_scan.py -v
