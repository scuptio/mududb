# Generated by Codex. Scan history before SDK builds receive permission to run.
name: Secret Scan

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  scan:
    name: Scan secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned Gitleaks CLI
        shell: bash
        run: |
          set -euo pipefail
          tool_dir="$(mktemp -d "$RUNNER_TEMP/gitleaks.XXXXXX")"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            --output "$tool_dir/gitleaks.tar.gz"
          printf '%s  %s\n' \
            9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c \
            "$tool_dir/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$tool_dir/gitleaks.tar.gz" -C "$tool_dir" gitleaks
          echo "$tool_dir" >> "$GITHUB_PATH"
      - name: Scan all fetched Git history
        run: bash script/ci/check_secrets.sh
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test SDK credential rejection
        run: python3 -m unittest discover -s script/sdk/tests -v
      - name: Test scanner detection and redaction
        run: python3 script/ci/test_secret_scan.py -v
